<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantasialand Pulse</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">

    <header class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-black text-amber-500 flex items-center gap-2">
          <i class="fa-solid fa-dragon"></i> Phantasialand Live
        </h1>
        <p class="text-xs text-slate-400">Live-Wartezeiten & 24h-Verlauf</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleNotifications()" id="notifyBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 w-9 h-9 rounded-xl text-xs transition flex items-center justify-center active:scale-95 shadow-lg" title="Benachrichtigungen">
          <i class="fa-regular fa-bell" id="notifyIcon"></i>
        </button>
        <button onclick="loadPhantasialandData()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 active:scale-95 shadow-lg shadow-amber-900/20">
          <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> Aktualisieren
        </button>
      </div>
    </header>

    <!-- Gesamt-Auslastung -->
    <div id="loadScoreBox" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-gauge-high text-amber-400"></i> Park-Auslastung
        </span>
        <span id="loadScoreLabel" class="text-xs font-black">--</span>
      </div>
      <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
        <div id="loadScoreBar" class="h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <p id="loadScoreText" class="text-[10px] text-slate-500 mt-2"></p>
    </div>

    <div id="statusBox" class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-xs text-slate-300 flex items-center justify-between gap-2 shadow-sm">
      <div class="flex items-center gap-2.5 min-w-0">
        <i class="fa-solid fa-clock text-amber-400 shrink-0"></i>
        <span id="statusText" class="truncate">Lade Stand der Daten...</span>
      </div>
      <span id="liveTimer" class="text-[10px] text-slate-500 shrink-0"></span>
    </div>

    <div id="ridesContainer" class="space-y-3">
      </div>

  </div>

  <script>
    const SERVER_URL = 'https://parkpulse-server.onrender.com';
    const PHANTASIALAND_ID = '56';
    const AUTO_REFRESH_SECONDS = 60;
    let chartInstances = {};
    let lastLoadTimestamp = null;
    let liveTimerInterval = null;
    let autoRefreshInterval = null;
    let notifiedThresholds = new Set(); // verhindert Spam: pro Session nur 1x pro Bahn benachrichtigen

    // ---------- FAVORITEN (gespeichert im Browser, überlebt Neuladen) ----------
    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem('pp_favorites') || '[]');
      } catch {
        return [];
      }
    }

    function toggleFavorite(rideName) {
      let favs = getFavorites();
      if (favs.includes(rideName)) {
        favs = favs.filter(f => f !== rideName);
      } else {
        favs.push(rideName);
      }
      localStorage.setItem('pp_favorites', JSON.stringify(favs));
      loadPhantasialandData(); // neu rendern, damit Sortierung/Stern sich aktualisiert
    }

    // ---------- SCHWELLENWERTE für Benachrichtigungen ----------
    function getThresholds() {
      try {
        return JSON.parse(localStorage.getItem('pp_thresholds') || '{}');
      } catch {
        return {};
      }
    }

    function hasThreshold(rideName) {
      const t = getThresholds();
      return t[rideName] !== undefined;
    }

    function openThresholdPrompt(rideName) {
      const current = getThresholds();
      const existing = current[rideName];
      const input = prompt(
        `Ab welcher Wartezeit (in Minuten) soll "${rideName}" dich benachrichtigen?\n(Leer lassen oder abbrechen, um die Warnung zu entfernen)`,
        existing !== undefined ? existing : ''
      );

      if (input === null) return; // Abbrechen

      if (input.trim() === '') {
        delete current[rideName];
      } else {
        const val = parseInt(input, 10);
        if (!isNaN(val) && val >= 0) {
          current[rideName] = val;
        }
      }
      localStorage.setItem('pp_thresholds', JSON.stringify(current));
      loadPhantasialandData();
    }

    function checkThresholds(rides) {
      const thresholds = getThresholds();
      rides.forEach(ride => {
        const limit = thresholds[ride.name];
        if (limit === undefined) return;

        const key = ride.name;
        if (ride.isOpen && ride.waitTime <= limit) {
          if (!notifiedThresholds.has(key)) {
            sendNotification(
              `🎢 ${ride.name}`,
              `Nur noch ${ride.waitTime} Min Wartezeit! (Grenze: ${limit} Min)`
            );
            notifiedThresholds.add(key);
          }
        } else {
          // Wartezeit wieder über der Grenze -> beim nächsten Unterschreiten erneut benachrichtigen
          notifiedThresholds.delete(key);
        }
      });
    }

    // ---------- BROWSER-BENACHRICHTIGUNGEN ----------
    // Hinweis: Funktioniert zuverlässig, solange die Seite geöffnet/im Hintergrund-Tab ist.
    // Für Benachrichtigungen bei komplett geschlossener App wäre echtes Web-Push (Service Worker + Server) nötig.
    function updateNotifyIcon() {
      const icon = document.getElementById('notifyIcon');
      if (!('Notification' in window)) {
        icon.className = 'fa-solid fa-bell-slash';
        return;
      }
      if (Notification.permission === 'granted') {
        icon.className = 'fa-solid fa-bell text-amber-400';
      } else {
        icon.className = 'fa-regular fa-bell';
      }
    }

    async function toggleNotifications() {
      if (!('Notification' in window)) {
        alert('Dein Browser unterstützt leider keine Benachrichtigungen.');
        return;
      }
      if (Notification.permission === 'granted') {
        alert('Benachrichtigungen sind bereits aktiviert. Setze pro Attraktion über die Glocke einen Schwellenwert, um informiert zu werden.');
        return;
      }
      const permission = await Notification.requestPermission();
      updateNotifyIcon();
      if (permission === 'granted') {
        sendNotification('🔔 Benachrichtigungen aktiv', 'Du wirst informiert, sobald eine Attraktion deinen Schwellenwert unterschreitet.');
      }
    }

    function sendNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, { body });
        } catch (e) {
          console.error('Notification-Fehler:', e);
        }
      }
    }

    // ---------- GESAMT-AUSLASTUNG DES PARKS ----------
    function updateLoadScore(rides) {
      const box = document.getElementById('loadScoreBox');
      const openRides = rides.filter(r => r.isOpen);

      if (openRides.length === 0) {
        box.classList.add('hidden');
        return;
      }

      const avgWait = openRides.reduce((sum, r) => sum + r.waitTime, 0) / openRides.length;
      // Skala: 0-60 Min Durchschnitt -> 0-100% Auslastung (gedeckelt bei 100)
      const percent = Math.min(100, Math.round((avgWait / 60) * 100));

      let color = '#10b981'; // emerald
      let label = 'Entspannt';
      if (percent > 70) {
        color = '#ef4444'; label = 'Sehr voll'; // red
      } else if (percent > 40) {
        color = '#f59e0b'; label = 'Mäßig voll'; // amber
      }

      box.classList.remove('hidden');
      document.getElementById('loadScoreBar').style.width = `${percent}%`;
      document.getElementById('loadScoreBar').style.backgroundColor = color;
      document.getElementById('loadScoreLabel').textContent = `${label} (${percent}%)`;
      document.getElementById('loadScoreLabel').style.color = color;
      document.getElementById('loadScoreText').textContent =
        `Ø Wartezeit: ${Math.round(avgWait)} Min über ${openRides.length} geöffnete Attraktionen`;
    }

    // ---------- LIVE-TIMER ("vor X Sekunden aktualisiert") ----------
    function startLiveTimer() {
      lastLoadTimestamp = Date.now();
      if (liveTimerInterval) clearInterval(liveTimerInterval);

      liveTimerInterval = setInterval(() => {
        if (!lastLoadTimestamp) return;
        const secondsAgo = Math.floor((Date.now() - lastLoadTimestamp) / 1000);
        const el = document.getElementById('liveTimer');
        if (!el) return;

        if (secondsAgo < 60) {
          el.textContent = `vor ${secondsAgo}s aktualisiert`;
        } else {
          const minutesAgo = Math.floor(secondsAgo / 60);
          el.textContent = `vor ${minutesAgo} Min aktualisiert`;
        }
      }, 1000);
    }

    // ---------- AUTO-REFRESH ----------
    function startAutoRefresh() {
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(() => {
        loadPhantasialandData();
      }, AUTO_REFRESH_SECONDS * 1000);
    }

    async function loadPhantasialandData() {
      const statusText = document.getElementById('statusText');
      const container = document.getElementById('ridesContainer');
      const icon = document.getElementById('refreshIcon');

      icon.classList.add('fa-spin');
      statusText.innerHTML = `Rufe aktuelle Zeiten ab...`;

      let history = [];

      // --- SCHRITT 1: Daten vom Server holen ---
      // Nur echte Netzwerk-/Server-Fehler landen hier im catch.
      try {
        const response = await fetch(`${SERVER_URL}/api/park?park=${PHANTASIALAND_ID}`);

        if (!response.ok) {
          throw new Error(`HTTP Fehler ${response.status}`);
        }

        const data = await response.json();
        history = data.history || [];

      } catch (err) {
        console.error("Fehler beim Verbindungsaufbau:", err);
        statusText.innerHTML = `❌ Verbindung getrennt. Bitte 'Aktualisieren' tippen.`;
        icon.classList.remove('fa-spin');
        return; // Hier abbrechen, da wir ohne Daten nichts rendern können
      }

      if (history.length === 0) {
        statusText.innerHTML = `⏳ Erste Messung läuft, bitte gleich nochmal tippen...`;
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400 bg-slate-900 border border-slate-800 rounded-xl space-y-2">
            <i class="fa-solid fa-hourglass-half text-3xl text-amber-400 animate-spin"></i>
            <p class="text-xs font-bold">Verbindung hergestellt...</p>
            <p class="text-[11px] text-slate-500">Erste Datenpunkte werden vom Phantasialand gesammelt.</p>
          </div>
        `;
        icon.classList.remove('fa-spin');
        return;
      }

      // Garantiert den neuesten Datenpunkt nehmen
      const latestEntry = history[history.length - 1];
      const latestRides = latestEntry.rides || [];
      const timeRecorded = latestEntry.time || 'Unbekannt';

      if (latestRides.length === 0) {
        statusText.innerHTML = `🌙 Phantasialand: Derzeit keine Live-Daten verfügbar.`;
        container.innerHTML = '';
        icon.classList.remove('fa-spin');
        return;
      }

      // Uhrzeit der letzten Aktualisierung direkt im Banner anzeigen
      statusText.innerHTML = `🟢 Live-Daten • Stand von <b>${timeRecorded} Uhr</b> (${latestRides.length} Bahnen geladen)`;
      startLiveTimer();

      // Auslastungs-Score berechnen und anzeigen
      updateLoadScore(latestRides);

      // Sortieren: Favoriten zuerst, dann geöffnete Bahnen, dann nach Wartezeit
      const favorites = getFavorites();
      latestRides.sort((a, b) => {
        const aFav = favorites.includes(a.name) ? 1 : 0;
        const bFav = favorites.includes(b.name) ? 1 : 0;
        return bFav - aFav || b.isOpen - a.isOpen || b.waitTime - a.waitTime;
      });

      // Schwellenwerte prüfen -> ggf. Benachrichtigung auslösen
      checkThresholds(latestRides);

      // --- SCHRITT 2: UI rendern ---
      container.innerHTML = latestRides.map((ride, index) => {
        const isOpen = ride.isOpen;
        const wait = ride.waitTime;
        const isFav = favorites.includes(ride.name);
        const rideKey = escapeHtml(ride.name).replace(/'/g, "\\'");

        let badgeColor = 'bg-slate-800 text-slate-400 border-slate-700';
        if (isOpen) {
          if (wait <= 15) badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
          else if (wait <= 40) badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
          else badgeColor = 'bg-red-500/10 text-red-400 border-red-500/30';
        }

        return `
          <div class="bg-slate-900 border ${isFav ? 'border-amber-500/40' : 'border-slate-800'} rounded-xl p-4 transition hover:border-slate-700">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5 min-w-0 flex-1 cursor-pointer select-none" onclick="toggleChart('${index}')">
                <div class="min-w-0 flex-1">
                  <h3 class="font-bold text-sm text-slate-100 truncate">${escapeHtml(ride.name)}</h3>
                  <span class="text-[10px] font-semibold ${isOpen ? 'text-emerald-400' : 'text-slate-500'} flex items-center gap-1 mt-0.5">
                    <span class="w-1.5 h-1.5 rounded-full ${isOpen ? 'bg-emerald-400 animate-pulse' : 'bg-slate-600'}"></span>
                    ${isOpen ? 'Geöffnet' : 'Geschlossen'} • <span class="text-amber-400 font-bold">Verlauf <i class="fa-solid fa-chevron-down text-[8px]"></i></span>
                  </span>
                </div>
              </div>

              <div class="flex items-center gap-2 shrink-0">
                <button onclick="toggleFavorite('${rideKey}')" class="w-7 h-7 flex items-center justify-center rounded-lg ${isFav ? 'text-amber-400' : 'text-slate-600 hover:text-slate-400'} transition" title="Favorit">
                  <i class="fa-solid fa-star text-xs"></i>
                </button>
                <button onclick="openThresholdPrompt('${rideKey}')" class="w-7 h-7 flex items-center justify-center rounded-lg ${hasThreshold(ride.name) ? 'text-amber-400' : 'text-slate-600 hover:text-slate-400'} transition" title="Warnung ab Wartezeit">
                  <i class="fa-solid fa-bell text-xs"></i>
                </button>
                <div class="px-3.5 py-1.5 rounded-lg border ${badgeColor} text-xs font-black">
                  ${isOpen ? `${wait} Min` : '---'}
                </div>
              </div>
            </div>

            <div id="chartContainer-${index}" class="hidden mt-4 pt-4 border-t border-slate-800/80">
              <p class="text-[10px] text-slate-400 mb-2 font-semibold">Wartezeitenverlauf heute (in Minuten):</p>
              <div class="h-36 w-full">
                <canvas id="chart-${index}"></canvas>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // --- SCHRITT 3: Diagramme zeichnen ---
      // Eigener try/catch, damit ein Chart-Fehler NIE die Statusanzeige überschreibt.
      try {
        if (typeof Chart === 'undefined') {
          console.error("Chart.js wurde nicht geladen (Bibliothek fehlt).");
        } else {
          latestRides.forEach((ride, index) => {
            const labels = history.map(h => h.time);
            const points = history.map(h => {
              if (!h.rides) return 0;
              const foundRide = h.rides.find(r => r.name === ride.name);
              return (foundRide && foundRide.isOpen) ? foundRide.waitTime : 0;
            });

            renderChart(index, labels, points);
          });
        }
      } catch (chartErr) {
        console.error("Fehler beim Zeichnen der Diagramme:", chartErr);
        // Status bleibt trotzdem auf "Live-Daten", da die Zeiten ja korrekt angezeigt wurden.
      }

      icon.classList.remove('fa-spin');
    }

    function toggleChart(index) {
      const container = document.getElementById(`chartContainer-${index}`);
      if (container) {
        container.classList.toggle('hidden');
      }
    }

    function renderChart(index, labels, points) {
      const ctx = document.getElementById(`chart-${index}`);
      if (!ctx) return;

      if (chartInstances[index]) {
        chartInstances[index].destroy();
      }

      chartInstances[index] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Wartezeit (Min)',
            data: points,
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.15)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointRadius: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#64748b', font: { size: 9 } }
            },
            y: {
              beginAtZero: true,
              grid: { color: '#1e293b' },
              ticks: { color: '#64748b', font: { size: 9 } }
            }
          }
        }
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    window.onload = function() {
      updateNotifyIcon();
      loadPhantasialandData();
      startAutoRefresh();
    };
  </script>
</body>
</html>
